name: Git Basics Autograding
on:
  push:
  pull_request:

jobs:
  autograding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch creation
        id: branch-test
        run: |
          CURRENT_BRANCH=$(git branch --show-current)
          if [ "$CURRENT_BRANCH" != "main" ] && [ "$CURRENT_BRANCH" != "master" ]; then
            echo "✅ Новая ветка создана: $CURRENT_BRANCH"
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Текущая ветка: $CURRENT_BRANCH"
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Check README.md editing
        id: readme-test
        run: |
          if git log --oneline --name-only | grep -q "README.md"; then
            LINES_CHANGED=$(git diff HEAD~1 HEAD -- README.md | grep -E "^\+|^-" | wc -l)
            if [ "$LINES_CHANGED" -ge 10 ]; then
              echo "✅ README.md изменен: $LINES_CHANGED строк"
              echo "result=success" >> $GITHUB_OUTPUT
            else
              echo "❌ Недостаточно изменений: $LINES_CHANGED строк (нужно 10)"
              echo "result=failure" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ README.md не найден в истории коммитов"
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Check multiple commits
        id: commits-test
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if [ "$COMMIT_COUNT" -ge 5 ]; then
            echo "✅ Достаточно коммитов: $COMMIT_COUNT"
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Коммитов: $COMMIT_COUNT (нужно 5)"
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Check commit messages quality
        id: messages-test
        run: |
          QUALITY_COMMITS=0
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          for commit in $(git log --oneline -10 | cut -d' ' -f1); do
            MESSAGE=$(git log --format=%s -n 1 $commit)
            MSG_LENGTH=${#MESSAGE}
            if [ $MSG_LENGTH -ge 10 ] && [ $MSG_LENGTH -le 100 ]; then
              QUALITY_COMMITS=$((QUALITY_COMMITS + 1))
            fi
          done
          if [ $QUALITY_COMMITS -ge 2 ]; then
            echo "✅ Качественных коммитов: $QUALITY_COMMITS из $TOTAL_COMMITS"
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Качественных коммитов: $QUALITY_COMMITS (нужно 2)"
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Check Pull Request creation
        id: pr-test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "✅ Pull Request создан: #${{ github.event.pull_request.number }}"
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Это не Pull Request (событие: ${{ github.event_name }})"
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Autograding Reporter
        run: |
          echo "=== Результаты автопроверки ==="
          echo "Ветка: ${{ steps.branch-test.outputs.result }}"
          echo "README: ${{ steps.readme-test.outputs.result }}"
          echo "Коммиты: ${{ steps.commits-test.outputs.result }}"
          echo "Сообщения: ${{ steps.messages-test.outputs.result }}"
          echo "Pull Request: ${{ steps.pr-test.outputs.result }}"
