name: Git Basics Autograding

on:
  pull_request:
    branches: [main, master]

jobs:
  autograding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch creation
        id: branch-test
        run: |
          BRANCH="${{ github.head_ref }}"
          if [ -n "$BRANCH" ] && [ "$BRANCH" != "main" ] && [ "$BRANCH" != "master" ]; then
            echo "✅ Новая ветка создана: $BRANCH"
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Имя ветки: '$BRANCH' (нужна ветка, отличная от main/master)"
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Check README.md editing
        id: readme-test
        run: |
          BASE="origin/${{ github.base_ref }}"
          if git diff "$BASE...HEAD" --name-only | grep -q "README.md"; then
            LINES_CHANGED=$(git diff "$BASE...HEAD" -- README.md \
              | grep -E "^\+" | grep -v "^+++" | wc -l)
            if [ "$LINES_CHANGED" -ge 10 ]; then
              echo "✅ README.md изменён: добавлено $LINES_CHANGED строк"
              echo "result=success" >> $GITHUB_OUTPUT
            else
              echo "❌ Добавлено строк в README.md: $LINES_CHANGED (нужно 10)"
              echo "result=failure" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ README.md не изменён относительно $BASE"
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Check multiple commits
        id: commits-test
        run: |
          BASE="origin/${{ github.base_ref }}"
          COMMIT_COUNT=$(git rev-list --count "$BASE..HEAD")
          if [ "$COMMIT_COUNT" -ge 5 ]; then
            echo "✅ Достаточно коммитов в ветке: $COMMIT_COUNT"
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Коммитов в ветке: $COMMIT_COUNT (нужно 5)"
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Check commit messages quality
        id: messages-test
        run: |
          BASE="origin/${{ github.base_ref }}"
          QUALITY_COMMITS=0
          TOTAL_COMMITS=$(git rev-list --count "$BASE..HEAD")
          for commit in $(git rev-list "$BASE..HEAD" | head -10); do
            MESSAGE=$(git log --format=%s -n 1 "$commit")
            MSG_LENGTH=${#MESSAGE}
            echo "  • '$MESSAGE' (${MSG_LENGTH} символов)"
            if [ "$MSG_LENGTH" -ge 10 ] && [ "$MSG_LENGTH" -le 100 ]; then
              QUALITY_COMMITS=$((QUALITY_COMMITS + 1))
            fi
          done
          if [ "$QUALITY_COMMITS" -ge 2 ]; then
            echo "✅ Качественных коммитов: $QUALITY_COMMITS из $TOTAL_COMMITS"
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Качественных коммитов: $QUALITY_COMMITS (нужно 2)"
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Check Pull Request creation
        id: pr-test
        run: |
          echo "✅ Pull Request создан: #${{ github.event.pull_request.number }}"
          echo "✅ Из ветки: ${{ github.head_ref }} → ${{ github.base_ref }}"
          echo "result=success" >> $GITHUB_OUTPUT

      - name: Autograding Reporter
        run: |
          echo "=========================================="
          echo "📊 Результаты автопроверки"
          echo "=========================================="
          echo "Ветка:          ${{ steps.branch-test.outputs.result }}"
          echo "README:         ${{ steps.readme-test.outputs.result }}"
          echo "Коммиты:        ${{ steps.commits-test.outputs.result }}"
          echo "Сообщения:      ${{ steps.messages-test.outputs.result }}"
          echo "Pull Request:   ${{ steps.pr-test.outputs.result }}"
          echo "=========================================="
          if [ "${{ steps.branch-test.outputs.result }}" = "success" ] && \
             [ "${{ steps.readme-test.outputs.result }}" = "success" ] && \
             [ "${{ steps.commits-test.outputs.result }}" = "success" ] && \
             [ "${{ steps.messages-test.outputs.result }}" = "success" ] && \
             [ "${{ steps.pr-test.outputs.result }}" = "success" ]; then
            echo "✅ ЗАДАНИЕ ВЫПОЛНЕНО"
            exit 0
          else
            echo "❌ ЕСТЬ НЕВЫПОЛНЕННЫЕ ПРОВЕРКИ"
            exit 1
          fi
